// alloy.local-config.yaml contains Grafana Alloy Flow (HCL-style) configuration, not YAML, even though it ends with .yaml.

// This tells Loki to find logs from the running container.
discovery.docker "flog_scrape" {
	host             = "unix:///var/run/docker.sock"
	refresh_interval = "5s" // check for logs every 5s.
}

discovery.relabel "flog_scrape" {
	targets = []

	rule {
		source_labels = ["__meta_docker_container_name"] // extracts the container names
		regex         = "/(.*)" // cleans up the existing name
		target_label  = "container"
	}
}

loki.source.docker "flog_scrape" {
	host             = "unix:///var/run/docker.sock"
	targets          = discovery.docker.flog_scrape.targets
	forward_to       = [loki.write.default.receiver]
	relabel_rules    = discovery.relabel.flog_scrape.rules
	refresh_interval = "5s"
}

// start of newly added config


local.file_match "system_logs" {
  path_targets = [{"__path__" = "/var/log/*.log"}]
  sync_period  = "5s"
}

loki.source.file "system_file_scrape" {
  targets       = local.file_match.system_logs.targets
  forward_to    = [loki.write.default.receiver]
  tail_from_end = true
}


local.file_match "loki_app_logs" {
  path_targets = [{"__path__" = "/logs/*.log"}]
  sync_period  = "5s"
}

loki.source.file "loki_app_file_scrape" {
  targets       = local.file_match.loki_app_logs.targets
  forward_to    = [loki.write.default.receiver]
  tail_from_end = true
}


local.file_match "parent_app_logs" {
  path_targets = [{"__path__" = "/logs-parent/*.log"}]
  sync_period  = "5s"
}

loki.source.file "parent_app_file_scrape" {
  targets       = local.file_match.parent_app_logs.targets
  forward_to    = [loki.write.default.receiver]
  tail_from_end = true
}

// end of newly added configs.

loki.write "default" {
	endpoint {
		url       = "http://gateway:3100/loki/api/v1/push"
		tenant_id = "tenant1"
	}
	external_labels = {}
}
