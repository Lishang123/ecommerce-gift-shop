spring:
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
      direct:
        observation-enabled: true

server:
  port: 8084

rabbitmq:
  exchange:
    name: order.exchange
  queue:
    name: order.queue
  routing:
    key: order.tracking

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:7777/eureka
    register-with-eureka: true
    fetch-registry: true

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
    # Unlike localhost, for docker, we have to specify the endpoint for services to export
    # the old config: management.zipkin.tracing.endpoint no longer works!!!!
    export:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
  observations:
    enabled: true
