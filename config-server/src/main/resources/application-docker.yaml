spring:
  application:
    name: config-server
  cloud: # Configures the behavior of the config server.
    config:
      server:
        native:
          # not work with Spring Cloud Bus + RabbitMQ because of JAR
          search-locations: classpath:/config
  rabbitmq: # for spring cloud bus
    host: rabbitmq
    port: 5672
    username: guest
    password: guest



server:
  port: 8888
